[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-commerce-demo"
version = "0.1.0"
description = "Arbiter-controlled commerce between Neuro-SAN agent networks"
requires-python = ">=3.12"
dependencies = ["neuro-san-studio==0.3.20", "neuro-san==0.6.95"]
readme = "README.md"

[project.scripts]
commerce-demo = "commerce_demo.cli:main"

[tool.setuptools.packages.find]
include = ["commerce_demo*"]

[tool.setuptools.package-data]
commerce_demo = ["static/*"]
